<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงทะเบียนรับหนังสือเข้าโรงเรียน</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- pdf-lib สำหรับประทับตรา PDF -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap');
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- 1. หน้า LOG IN -->
  <div id="loginSection" class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-blue-900">ระบบรับหนังสือเข้า</h1>
        <p class="text-gray-500 text-sm">เข้าสู่ระบบเพื่อใช้งาน</p>
      </div>
      
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-semibold mb-2">ชื่อผู้ใช้ (Username)</label>
          <input type="text" id="username" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="mb-6">
          <label class="block text-gray-700 text-sm font-semibold mb-2">รหัสผ่าน (Password)</label>
          <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" id="btnLogin" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2 rounded-lg transition duration-200">
          เข้าสู่ระบบ
        </button>
      </form>
    </div>
  </div>

  <!-- 2. หน้า MAIN DASHBOARD (แสดงเมื่อ Log In สำเร็จ) -->
  <div id="mainDashboard" class="hidden">
    <!-- Navbar -->
    <nav class="bg-blue-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
      <div>
        <h2 class="font-bold text-lg">ระบบลงทะเบียนรับหนังสือเข้า</h2>
        <span id="userInfo" class="text-xs text-blue-200"></span>
      </div>
      <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white text-sm px-3 py-1.5 rounded-lg transition">
        ออกจากระบบ
      </button>
    </nav>

    <!-- Content Area ตามสิทธิ์ -->
    <div class="container mx-auto p-6">
      
      <!-- เมนูแจ้งเตือน / สรุปจำนวนหนังสือ -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
          <p class="text-sm text-gray-500">หนังสือรอดำเนินการ</p>
          <p id="pendingCount" class="text-2xl font-bold text-blue-700">0</p>
        </div>
        <div id="sarabunBadgeBox" class="hidden bg-white p-4 rounded-lg shadow border-l-4 border-amber-500">
          <p class="text-sm text-gray-500">หนังสือจากฝ่ายบริหาร (ส่งกลับสารบรรณ)</p>
          <p id="fromExecCount" class="text-2xl font-bold text-amber-600">0</p>
        </div>
      </div>

      <!-- พื้นที่แสดงระบบงานสารบรรณ / ฝ่ายบริหาร / ครู -->
      <div id="roleContent" class="bg-white p-6 rounded-lg shadow">
        <!-- จะถูกโหลดเนื้อหาตามสิทธิ์การใช้งานผ่าน JavaScript -->
      </div>
    </div>
  </div>

  <script>
    // ** เปลี่ยน URL นี้ให้ตรงกับ Apps Script Web App URL ของคุณครู **
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxw0zb196W_WDnIvW_TpfEcmreRUEtkE1aKWCI4w68d1dafBtUs308Sl-jcfMYxF8t1/exec"; 
    
    let currentUser = null;

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.innerText = "กำลังเข้าสู่ระบบ...";
      btn.disabled = true;

      const payload = {
        action: 'LOGIN',
        data: {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        }
      };

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const res = await response.json();

        if (res.success) {
          currentUser = res.user;
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('mainDashboard').classList.remove('hidden');
          document.getElementById('userInfo').innerText = `${currentUser.name} (${currentUser.position})`;
          
          // โหลดหน้าจอตามสิทธิ์
          loadRoleDashboard();
        } else {
          alert(res.message);
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการเชื่อมต่อระบบ");
        console.error(err);
      } finally {
        btn.innerText = "เข้าสู่ระบบ";
        btn.disabled = false;
      }
    }

    function loadRoleDashboard() {
      const content = document.getElementById('roleContent');
      if (currentUser.role === 'SARABUN') {
        document.getElementById('sarabunBadgeBox').classList.remove('hidden');
        content.innerHTML = `<h3 class="text-xl font-bold text-gray-800 mb-4">ระบบงานสารบรรณโรงเรียน</h3>
                             <p class="text-gray-600">พร้อมสำหรับเริ่มพัฒนาระบบลงรับหนังสือและประทับตรา</p>`;
      } else if (currentUser.role === 'DIRECTOR' || currentUser.role === 'VICE_DIRECTOR') {
        content.innerHTML = `<h3 class="text-xl font-bold text-gray-800 mb-4">ระบบฝ่ายบริหาร</h3>
                             <p class="text-gray-600">สำหรับพิจารณาและเกษียณหนังสือสั่งการ</p>`;
      } else {
        content.innerHTML = `<h3 class="text-xl font-bold text-gray-800 mb-4">ระบบครูและบุคลากร</h3>
                             <p class="text-gray-600">สำหรับรับทราบหนังสือเข้าที่ได้รับมอบหมาย</p>`;
      }
    }

    function logout() {
      currentUser = null;
      document.getElementById('mainDashboard').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('loginForm').reset();
    }
  </script>
</body>
</html>
